name: Build and Deploy

# dist/ is BUILT HERE and nowhere else that matters. It is not tracked in git
# (see .gitignore): this job compiles the sources into dist/ and the FTPS step
# below uploads the working tree it just produced, so the live site is always
# exactly what this run compiled.
#
# The bundle used to be committed back to main by this workflow. That is what
# the old "Build: recompile dist/ [skip ci]" commits were, and it was a standing
# nuisance — the bot pushed on top of whatever a human had just pushed, so the
# next push needed a pull, and a rebase of the generated file against a hand
# edit could silently drop real changes. It was never necessary either: the
# deploy uploads the compiled working tree, not the commit.
#
# Build and deploy are ONE job on purpose: what gets uploaded is the working
# tree this run just compiled, so the live site can never be a build behind.
#
# As two workflows they raced — both triggered on the same push, so the deploy
# could upload the old bundle while the build was still compiling the new one.
#
# On a pull request it compiles to prove the sources still build, but never
# deploys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Read-only. This workflow no longer writes to the repository.
permissions:
  contents: read

# One at a time per branch. Two overlapping FTPS syncs would interleave uploads
# and confuse the action's server-side state file. A running deploy is never
# cancelled — a half-uploaded site is worse than a slightly stale one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 22, not 20: build.mjs gates the compile on `node --test
      # 'test/**/*.test.mjs'`, and glob patterns for the test runner only exist
      # from 22 on. Node 20 reads that pattern as a literal filename, finds no
      # such file, and fails the build with "Could not find" — a green suite
      # locally, a red run here, for no reason a reader would guess.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      # The only place the shipped bundle is made. A failure here fails the run
      # and nothing is uploaded, which is the check that used to be spelled
      # "is the committed dist/ stale?" — there is no committed dist/ to be
      # stale now, so building it IS the test.
      - name: Compile
        run: node build.mjs

      - name: Confirm the bundle was produced
        run: |
          test -s dist/app.js || { echo "::error::dist/app.js missing or empty"; exit 1; }
          test -s dist/precache.json || { echo "::error::dist/precache.json missing"; exit 1; }
          ls -l dist/

      - name: Sync files via FTPS
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTPS_SERVER }}
          username: ${{ secrets.FTPS_USERNAME }}
          password: ${{ secrets.FTPS_PASSWORD }}
          protocol: ftps
          # Optional: You can specify a local and remote directory.
          # local-dir: ./
          # server-dir: /public_html/

          # dist/ is intentionally NOT excluded — it is untracked in git but it
          # is the whole point of the upload. node_modules is the one that
          # matters here: the build step above creates it in this same working
          # tree, and without this line the deploy would push tens of thousands
          # of build-only files to the site.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            Documentation/**
            node_modules/**
