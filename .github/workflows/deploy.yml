name: Build and Deploy

# The site is served straight from the repo, so dist/app.js IS the release.
# Build and deploy are ONE job on purpose: what gets uploaded is the working
# tree this run just compiled, so the live site can never be a build behind.
#
# As two workflows they raced — both triggered on the same push, so the deploy
# could upload the old bundle while the build was still compiling the new one,
# and the build's "[skip ci]" commit then triggered no deploy at all, leaving
# the fix stranded until somebody pushed again.
#
# On a pull request it compiles and checks, but never commits and never deploys.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# One at a time per branch. Two overlapping FTP syncs would interleave uploads
# and confuse the action's server-side state file. A running deploy is never
# cancelled — a half-uploaded site is worse than a slightly stale one.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install build dependencies
        run: npm install --no-audit --no-fund

      - name: Compile
        run: node build.mjs

      - name: Fail a PR whose bundle is stale
        if: github.event_name == 'pull_request'
        run: |
          if ! git diff --quiet -- dist/; then
            echo "::error::dist/ is out of date with the sources."
            echo "Run ./build.sh and commit the result."
            git diff --stat -- dist/
            exit 1
          fi
          echo "dist/ matches the sources."

      - name: Commit the rebuilt bundle
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet -- dist/; then
            echo "dist/ already up to date — nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/
          git commit -m "Build: recompile dist/ [skip ci]"
          git push

      - name: Sync files via FTPS
        if: github.event_name != 'pull_request'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTPS_SERVER }}
          username: ${{ secrets.FTPS_USERNAME }}
          password: ${{ secrets.FTPS_PASSWORD }}
          protocol: ftps
          # Optional: You can specify a local and remote directory.
          # local-dir: ./
          # server-dir: /public_html/

          # node_modules is the one that matters now: the build step above
          # creates it in this same working tree, and without this line the
          # deploy would push tens of thousands of build-only files to the site.
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            Documentation/**
            node_modules/**
