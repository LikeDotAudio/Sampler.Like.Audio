<script>
  const N = 96000, data = new Float32Array(N);
  for (let i = 0; i < N; i++) data[i] = Math.sin(i / 25) * Math.exp(-i / 26000);
  const buffer = { duration: 2, length: N, sampleRate: 48000, numberOfChannels: 1, getChannelData: () => data };
  window.OA_DRUM_SAMPLES[0] = { idx: 0, buffer, name: 'REC 141233.wav', pitch: 1, offset: 0.2, end: 1.5, fadeIn: 0.15, fadeOut: 0.3, fade: true, loop: false };
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(window.SamplerEditor, { idx: 0, name: 'Kick', onClose: () => {} })
  );
</script>
