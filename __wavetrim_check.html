<!doctype html>
<html><head><meta charset="utf-8">
<style>body{background:#1c1c1c;margin:0;padding:20px;font-family:sans-serif;--accent:#e59b3a;--accent-rgb:229,155,58;--accent-t15:#efb765;}</style>
</head><body>
<div id="root" style="width:900px"></div>
<script src="/vendor/react.production.min.js"></script>
<script src="/vendor/react-dom.production.min.js"></script>
<script src="/dist/app.js"></script>
<script>
  // A synthetic 2-second buffer: decaying sine, enough for drawWave.
  const N = 96000, data = new Float32Array(N);
  for (let i = 0; i < N; i++) data[i] = Math.sin(i / 30) * Math.exp(-i / 30000);
  const buffer = { duration: 2, length: N, sampleRate: 48000, numberOfChannels: 1, getChannelData: () => data };
  const trim = { in: 0.25, out: 1.6, fadeIn: 0.2, fadeOut: 0.35 };
  ReactDOM.createRoot(document.getElementById('root')).render(
    React.createElement(window.WaveTrim, {
      buffer, trim, pos: 0.5, active: true,
      setTrimPoint: () => {}, onScrub: () => {},
    })
  );
  document.title = window.WaveTrim ? 'ok' : 'MISSING';
</script>
</body></html>
