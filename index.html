<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Sampler & Sequencer</title>
    
    <!-- React & ReactDOM -->
    <script src="./vendor/react.production.min.js"></script>
    <script src="./vendor/react-dom.production.min.js"></script>
    

    <!-- Progressive Web App Settings -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#f4902c">
    <link rel="icon" href="./ICON and LOGO/favicon.ico">
    <link rel="apple-touch-icon" href="./ICON and LOGO/icon-192.png">
    <link rel="apple-touch-startup-image" href="./ICON and LOGO/splash.png">

    <style>
        body {
            background-color: var(--bg, #1b1d22);
            color: var(--text, #d7dce3);
            font-family: "Segoe UI", system-ui, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            height: 100dvh;
            overflow: hidden;
        }

        #root {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Variables extracted from user's mixer */
        :root {
            --bg: #1b1c1e;
            --panel: #242528;
            --strip: #2b2b2e;
            /* The one colour the whole app is keyed to. Config's theme picker
               rewrites this on :root at runtime; everything below is derived
               from it, so one property changes the entire page. Deliberately
               NOT persisted — the app comes back up orange on every load. */
            --accent: #f4902c;
            --accent-rgb: 244, 144, 44;   /* the same colour, for rgba() glows */
            --text: #e8e8e8;
            --muted: #888a8d;
            --on: var(--accent);
            --solo: var(--accent-t40);

            /* Tints toward white and shades toward black, so a family of
               related colours follows whatever hue is picked instead of a
               fixed row of oranges going out of tune with it. */
            --accent-t15: color-mix(in srgb, var(--accent) 85%, #fff);
            --accent-t25: color-mix(in srgb, var(--accent) 75%, #fff);
            --accent-t40: color-mix(in srgb, var(--accent) 60%, #fff);
            --accent-t60: color-mix(in srgb, var(--accent) 40%, #fff);
            --accent-s15: color-mix(in srgb, var(--accent) 85%, #000);
            --accent-s25: color-mix(in srgb, var(--accent) 75%, #000);
            --accent-s40: color-mix(in srgb, var(--accent) 60%, #000);
            --accent-s55: color-mix(in srgb, var(--accent) 45%, #000);
            --accent-s70: color-mix(in srgb, var(--accent) 30%, #000);
            --accent-s80: color-mix(in srgb, var(--accent) 20%, #000);
            --accent-s85: color-mix(in srgb, var(--accent) 15%, #000);
            /* Translucent washes for glows and hover fills. */
            --accent-a10: color-mix(in srgb, var(--accent) 10%, transparent);
            --accent-a25: color-mix(in srgb, var(--accent) 25%, transparent);
            --accent-a50: color-mix(in srgb, var(--accent) 50%, transparent);
            /* Text that sits ON the accent — near-black reads on every hue the
               picker can produce, which a white label would not. */
            --on-accent: #111;
        }

        #app-container {
            display: flex;
            flex-direction: column;
            height: 100%;
            width: 100%;
        }

        .flex-row {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }
        
        .chunky-scrollbar::-webkit-scrollbar {
            height: 56px;
        }
        .chunky-scrollbar::-webkit-scrollbar-track {
            background-color: #1a1c1e;
            border: 2px solid #000;
            border-radius: 6px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
            margin: 4px;
        }
        .chunky-scrollbar::-webkit-scrollbar-thumb {
            background-color: var(--accent);
            border: 2px solid #000;
            border-radius: 4px;
            box-shadow: inset 0 2px 2px rgba(255,255,255,0.3), inset 0 -2px 2px rgba(0,0,0,0.3);
            background-image: linear-gradient(90deg, 
                transparent 40%, rgba(0,0,0,0.8) 40%, rgba(0,0,0,0.8) 60%, transparent 60%
            );
            cursor: pointer;
        }
        .chunky-scrollbar::-webkit-scrollbar-thumb:hover {
            background-color: var(--accent-t60);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <!-- Mount App -->
    <!-- Everything: 53 sources compiled ahead of time by build.mjs -->
    <script src="./dist/app.js"></script>
</body>
</html>
